server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
        http:

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo

metrics_generator:
  storage:
    path: /tmp/tempo/generator

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, service-graphs]
