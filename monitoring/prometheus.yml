global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: "analytics-service"
    static_configs:
      - targets: ["analytics-service:8002"]

  - job_name: "auth-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:8001"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "app"
    static_configs:
      - targets: ["app:5000"]

  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]

rule_files:
  - "alerts.yml"


alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
